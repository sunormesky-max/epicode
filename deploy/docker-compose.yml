services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.cloud
    environment:
      RUST_LOG: info
      EPICODE_LISTEN_ADDR: 0.0.0.0:9111
      EPICODE_ADMIN_KEY: ${EPICODE_ADMIN_KEY}
      EPICODE_MASTER_KEY: ${EPICODE_MASTER_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      REDIS_URL: ${REDIS_URL:-}
    volumes:
      - backend-data:/app/data
    # 只绑定回环: 对外流量必须经 gateway(TLS 终止/限流/请求策略), 不可绕过网关直连
    ports:
      - "127.0.0.1:9111:9111"
    depends_on:
      redis:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    # 只绑定回环: 由 gateway 反代, 不直接对外
    ports:
      - "127.0.0.1:3000:3000"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  backend-data:
