# 网关级登录限流(审计三轮中优): 后端按 TCP peer IP 分桶, 反代后所有
# 客户端共享网关 IP 的额度 — 单一客户端可阻断他人登录, 网关按真实
# 客户端 IP($binary_remote_addr)再设一层. limit_req_zone 仅 http 上下文合法.
limit_req_zone $binary_remote_addr zone=login_gate:10m rate=2r/s;

server {
    listen 80;
    server_name _;

    # API routes — must come before the catch-all frontend route.
    # Public API prefix is /api/v1. Nginx strips /api and forwards the
    # remaining /v1/... path to the backend. The backend serves /v1 directly.
    location /api/ {
        # 登录/注册突发容忍 10(正常登录重试), 超限 503
        limit_req zone=login_gate burst=10 nodelay;
        proxy_pass http://backend:9111/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location = /health {
        proxy_pass http://backend:9111/health;
    }

    # Public stats endpoint
    location = /stats/public {
        proxy_pass http://backend:9111/stats/public;
    }

    # OpenAPI documentation
    location = /docs {
        proxy_pass http://backend:9111/docs;
    }

    location = /openapi.yaml {
        proxy_pass http://backend:9111/openapi.yaml;
    }

    # Frontend SPA — catch-all, must be last
    location / {
        proxy_pass http://frontend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
