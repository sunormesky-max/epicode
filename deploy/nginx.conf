server {
    listen 80;
    server_name _;

    # Canonicalize the public API prefix before proxying it.
    location = /api {
        return 308 /api/;
    }

    # The frontend owns its tRPC endpoint; all other /api routes belong to the
    # Cloud backend. This exception must precede the backend API prefix.
    location ^~ /api/trpc {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public API prefix is /api/v1. The trailing slash on proxy_pass strips
    # /api so the Cloud backend receives the /v1 routes it registers.
    location ^~ /api/ {
        proxy_pass http://backend:9111/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location = /health {
        proxy_pass http://backend:9111/health;
    }

    # Public stats endpoint
    location = /stats/public {
        proxy_pass http://backend:9111/stats/public;
    }

    # OpenAPI documentation
    location = /docs {
        proxy_pass http://backend:9111/docs;
    }

    location = /openapi.yaml {
        proxy_pass http://backend:9111/openapi.yaml;
    }

    # Frontend SPA — catch-all, must be last
    location / {
        proxy_pass http://frontend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
