apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/name: epicode
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  EPICODE_API_KEY: {{ .Values.env.EPICODE_API_KEY | required "env.EPICODE_API_KEY is required" | quote }}
  EPICODE_ADMIN_KEY: {{ .Values.env.EPICODE_ADMIN_KEY | required "env.EPICODE_ADMIN_KEY is required" | quote }}
  EPICODE_CORS_ORIGIN: {{ .Values.env.EPICODE_CORS_ORIGIN | required "env.EPICODE_CORS_ORIGIN is required" | quote }}
  APP_ID: {{ .Values.env.APP_ID | required "env.APP_ID is required" | quote }}
  APP_SECRET: {{ .Values.env.APP_SECRET | required "env.APP_SECRET is required" | quote }}
  DATABASE_URL: {{ .Values.env.DATABASE_URL | required "env.DATABASE_URL is required" | quote }}
  KIMI_AUTH_URL: {{ .Values.env.KIMI_AUTH_URL | required "env.KIMI_AUTH_URL is required" | quote }}
  KIMI_OPEN_URL: {{ .Values.env.KIMI_OPEN_URL | required "env.KIMI_OPEN_URL is required" | quote }}
  {{- if .Values.env.EPICODE_MASTER_KEY }}
  EPICODE_MASTER_KEY: {{ .Values.env.EPICODE_MASTER_KEY | quote }}
  {{- end }}
  {{- if .Values.env.DEEPSEEK_API_KEY }}
  DEEPSEEK_API_KEY: {{ .Values.env.DEEPSEEK_API_KEY | quote }}
  {{- end }}
  {{- if .Values.env.REDIS_URL }}
  REDIS_URL: {{ .Values.env.REDIS_URL | quote }}
  {{- end }}
  {{- if .Values.env.OWNER_UNION_ID }}
  OWNER_UNION_ID: {{ .Values.env.OWNER_UNION_ID | quote }}
  {{- end }}
