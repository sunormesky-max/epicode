{{- /*
  密钥管理 (审计 2026-09 中优 #15):
  - 推荐: externalSecret.existingSecret 指向运维自建的 Secret(external-secrets 等), 密钥不进 values/release 记录
  - 显式 opt-in: env.EPICODE_ADMIN_KEY 非空时才由 chart 创建(会进入 helm release 记录, 仅限开发)
*/ -}}
{{- if and (not .Values.externalSecret.existingSecret) .Values.env.EPICODE_ADMIN_KEY }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/name: epicode
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  EPICODE_ADMIN_KEY: {{ .Values.env.EPICODE_ADMIN_KEY | quote }}
  EPICODE_MASTER_KEY: {{ .Values.env.EPICODE_MASTER_KEY | quote }}
  {{- if .Values.env.DEEPSEEK_API_KEY }}
  DEEPSEEK_API_KEY: {{ .Values.env.DEEPSEEK_API_KEY | quote }}
  {{- end }}
  {{- if .Values.env.REDIS_URL }}
  REDIS_URL: {{ .Values.env.REDIS_URL | quote }}
  {{- end }}
{{- end }}
