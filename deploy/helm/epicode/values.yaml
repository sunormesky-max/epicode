# Default values for Epicode Helm chart.
# Override these in your values.yaml or via --set.

replicaCount:
  backend: 1
  frontend: 2

image:
  backend:
    repository: ghcr.io/sunormesky-max/epicode-backend
    tag: "1.0.1"
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/sunormesky-max/epicode-frontend
    tag: "1.0.1"
    pullPolicy: IfNotPresent

# Required secrets — provide via --set or an external secret manager.
# Values marked REQUIRED must be set to start the Cloud backend and production
# frontend. EPICODE_MASTER_KEY, DEEPSEEK_API_KEY, REDIS_URL, and
# OWNER_UNION_ID are optional.
env:
  EPICODE_API_KEY: ""          # REQUIRED
  EPICODE_ADMIN_KEY: ""        # REQUIRED
  EPICODE_MASTER_KEY: ""       # optional (32-byte base64)
  EPICODE_CORS_ORIGIN: ""      # REQUIRED public origin, e.g. https://epicode.example.com
  DEEPSEEK_API_KEY: ""         # optional
  REDIS_URL: ""                # optional, enables distributed rate limiting
  RUST_LOG: "info"
  EPICODE_LISTEN_ADDR: "0.0.0.0:9111"
  APP_ID: ""                   # REQUIRED frontend production configuration
  APP_SECRET: ""               # REQUIRED frontend production configuration
  DATABASE_URL: ""             # REQUIRED frontend production configuration
  KIMI_AUTH_URL: ""            # REQUIRED frontend production configuration
  KIMI_OPEN_URL: ""            # REQUIRED frontend production configuration
  OWNER_UNION_ID: ""           # optional

service:
  backend:
    type: ClusterIP
    port: 9111
  frontend:
    type: ClusterIP
    port: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  api:
    path: /api/v1(/|$)(.*)
    pathType: ImplementationSpecific
    annotations:
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /v1/$2
  hosts:
    - host: epicode.example.com
      paths:
        - path: /api/trpc
          pathType: Prefix
          service: frontend
        - path: /api/health
          pathType: Exact
          service: backend
        - path: /api/register
          pathType: Exact
          service: backend
        - path: /api/mcp
          pathType: Exact
          service: backend
        - path: /api/stats/public
          pathType: Exact
          service: backend
        - path: /docs
          pathType: Exact
          service: backend
        - path: /openapi.yaml
          pathType: Exact
          service: backend
        - path: /health
          pathType: Exact
          service: backend
        - path: /stats/public
          pathType: Exact
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls:
    - secretName: epicode-tls
      hosts:
        - epicode.example.com

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /app/data

resources:
  backend:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  frontend:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

probes:
  backend:
    liveness:
      httpGet:
        path: /health
        port: 9111
      initialDelaySeconds: 10
      periodSeconds: 30
    readiness:
      httpGet:
        path: /health
        port: 9111
      initialDelaySeconds: 5
      periodSeconds: 10
  frontend:
    liveness:
      httpGet:
        path: /health
        port: 3000
      initialDelaySeconds: 10
      periodSeconds: 30
    readiness:
      httpGet:
        path: /health
        port: 3000
      initialDelaySeconds: 5
      periodSeconds: 10
  redis:
    liveness:
      exec:
        command: ["redis-cli", "ping"]
      initialDelaySeconds: 5
      periodSeconds: 30
    readiness:
      exec:
        command: ["redis-cli", "ping"]
      initialDelaySeconds: 2
      periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

redis:
  enabled: true
  image: redis:7-alpine
  # REDIS_URL defaults to this bundled instance when enabled. Set
  # env.REDIS_URL to use an external Redis service instead.
  persistence:
    enabled: false  # cache is rebuildable

nodeSelector: {}
tolerations: []
affinity: {}
