# NOTE: image tags below are pinned to the release version (e.g. :1.0.1), NOT
# :latest, so deployments are reproducible. Update these tags together with
# deploy/helm/epicode/values.yaml on every release.
apiVersion: v1
kind: Namespace
metadata:
  name: epicode
---
apiVersion: v1
kind: Secret
metadata:
  name: epicode-secrets
  namespace: epicode
type: Opaque
stringData:
  # 部署前必须替换为真实密钥 — 后端对已知占位值(replace-me 等)拒绝启动(fail-closed)
  DEEPSEEK_API_KEY: REPLACE_WITH_REAL_KEY
  EPICODE_ADMIN_KEY: REPLACE_WITH_REAL_KEY
  EPICODE_MASTER_KEY: ""
  REDIS_URL: redis://epicode-redis:6379
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: epicode-backend-data
  namespace: epicode
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epicode-redis
  namespace: epicode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epicode-redis
  template:
    metadata:
      labels:
        app: epicode-redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: epicode-redis
  namespace: epicode
spec:
  selector:
    app: epicode-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epicode-backend
  namespace: epicode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epicode-backend
  template:
    metadata:
      labels:
        app: epicode-backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/sunormesky-max/epicode-backend:1.0.3
          ports:
            - containerPort: 9111
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 9111
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 9111
            initialDelaySeconds: 10
            periodSeconds: 10
          env:
            - name: RUST_LOG
              value: info
            - name: EPICODE_LISTEN_ADDR
              value: 0.0.0.0:9111
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: epicode-secrets
                  key: DEEPSEEK_API_KEY
            - name: EPICODE_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: epicode-secrets
                  key: EPICODE_ADMIN_KEY
            - name: EPICODE_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: epicode-secrets
                  key: EPICODE_MASTER_KEY
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: epicode-secrets
                  key: REDIS_URL
          volumeMounts:
            - name: backend-data
              mountPath: /app/data
      volumes:
        - name: backend-data
          persistentVolumeClaim:
            claimName: epicode-backend-data
---
apiVersion: v1
kind: Service
metadata:
  name: epicode-backend
  namespace: epicode
spec:
  selector:
    app: epicode-backend
  ports:
    - port: 9111
      targetPort: 9111
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epicode-frontend
  namespace: epicode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epicode-frontend
  template:
    metadata:
      labels:
        app: epicode-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/sunormesky-max/epicode-frontend:1.0.3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: epicode-frontend
  namespace: epicode
spec:
  selector:
    app: epicode-frontend
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: epicode
  namespace: epicode
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    # TLS by default: force HTTPS redirect (provide a TLS secret / cert-manager)
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  # TLS(审计二轮): ssl-redirect 已强制 https, 此处声明证书;
  # 1) 自备证书: kubectl create secret tls epicode-tls --cert=... --key=...
  # 2) cert-manager: 部署前给 Ingress 加 cert-manager.io/cluster-issuer 注解
  tls:
    - hosts:
        - epicode.example.com
      secretName: epicode-tls
  rules:
    - host: epicode.example.com
      http:
        paths:
          # Public API prefix is /api/v1. The backend strips the /api
          # prefix itself (helpers::strip_api_prefix_middleware), so the
          # Ingress forwards /api/* verbatim and /api/v1/x -> /v1/x.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: epicode-backend
                port:
                  number: 9111
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: epicode-backend
                port:
                  number: 9111
          - path: /openapi.yaml
            pathType: Prefix
            backend:
              service:
                name: epicode-backend
                port:
                  number: 9111
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: epicode-backend
                port:
                  number: 9111
          - path: /
            pathType: Prefix
            backend:
              service:
                name: epicode-frontend
                port:
                  number: 3000
