# NOTE: image tags below are pinned to the release version (e.g. :1.0.1), NOT
# :latest, so deployments are reproducible. Update these tags together with
# deploy/helm/epicode/values.yaml on every release.
apiVersion: v1
kind: Namespace
metadata:
  name: epicode
---
apiVersion: v1
kind: Secret
metadata:
  name: epicode-secrets
  namespace: epicode
type: Opaque
stringData:
  EPICODE_API_KEY: replace-me
  DEEPSEEK_API_KEY: replace-me
  EPICODE_ADMIN_KEY: replace-me
  EPICODE_MASTER_KEY: ""
  EPICODE_CORS_ORIGIN: https://epicode.example.com
  REDIS_URL: redis://epicode-redis:6379
  APP_ID: replace-me
  APP_SECRET: replace-me
  DATABASE_URL: replace-me
  KIMI_AUTH_URL: replace-me
  KIMI_OPEN_URL: replace-me
  OWNER_UNION_ID: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: epicode-backend-data
  namespace: epicode
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epicode-redis
  namespace: epicode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epicode-redis
  template:
    metadata:
      labels:
        app: epicode-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: epicode-redis
  namespace: epicode
spec:
  type: ClusterIP
  selector:
    app: epicode-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epicode-backend
  namespace: epicode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epicode-backend
  template:
    metadata:
      labels:
        app: epicode-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/sunormesky-max/epicode-backend:1.0.1
          ports:
            - containerPort: 9111
          env:
            - name: RUST_LOG
              value: info
            - name: EPICODE_LISTEN_ADDR
              value: 0.0.0.0:9111
            - name: EPICODE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: epicode-secrets
                  key: EPICODE_API_KEY
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: epicode-secrets
                  key: DEEPSEEK_API_KEY
            - name: EPICODE_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: epicode-secrets
                  key: EPICODE_ADMIN_KEY
            - name: EPICODE_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: epicode-secrets
                  key: EPICODE_MASTER_KEY
            - name: EPICODE_CORS_ORIGIN
              valueFrom:
                secretKeyRef:
                  name: epicode-secrets
                  key: EPICODE_CORS_ORIGIN
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: epicode-secrets
                  key: REDIS_URL
          volumeMounts:
            - name: backend-data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /health
              port: 9111
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 9111
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: backend-data
          persistentVolumeClaim:
            claimName: epicode-backend-data
---
apiVersion: v1
kind: Service
metadata:
  name: epicode-backend
  namespace: epicode
spec:
  type: ClusterIP
  selector:
    app: epicode-backend
  ports:
    - name: http
      port: 9111
      targetPort: 9111
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epicode-frontend
  namespace: epicode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epicode-frontend
  template:
    metadata:
      labels:
        app: epicode-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/sunormesky-max/epicode-frontend:1.0.1
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: APP_ID
              valueFrom:
                secretKeyRef:
                  name: epicode-secrets
                  key: APP_ID
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: epicode-secrets
                  key: APP_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: epicode-secrets
                  key: DATABASE_URL
            - name: KIMI_AUTH_URL
              valueFrom:
                secretKeyRef:
                  name: epicode-secrets
                  key: KIMI_AUTH_URL
            - name: KIMI_OPEN_URL
              valueFrom:
                secretKeyRef:
                  name: epicode-secrets
                  key: KIMI_OPEN_URL
            - name: OWNER_UNION_ID
              valueFrom:
                secretKeyRef:
                  name: epicode-secrets
                  key: OWNER_UNION_ID
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: epicode-frontend
  namespace: epicode
spec:
  type: ClusterIP
  selector:
    app: epicode-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: epicode-api
  namespace: epicode
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /v1/$2
spec:
  ingressClassName: nginx
  rules:
    - host: epicode.example.com
      http:
        paths:
          # Rewrite public /api/v1/... to the Cloud backend's registered
          # /v1/... routes. Keeping this matcher narrow prevents it from
          # swallowing the frontend /api/trpc route.
          - path: /api/v1(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: epicode-backend
                port:
                  number: 9111
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: epicode
  namespace: epicode
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
spec:
  ingressClassName: nginx
  rules:
    - host: epicode.example.com
      http:
        paths:
          - path: /api/trpc
            pathType: Prefix
            backend:
              service:
                name: epicode-frontend
                port:
                  number: 3000
          - path: /api/health
            pathType: Exact
            backend:
              service:
                name: epicode-backend
                port:
                  number: 9111
          - path: /api/register
            pathType: Exact
            backend:
              service:
                name: epicode-backend
                port:
                  number: 9111
          - path: /api/mcp
            pathType: Exact
            backend:
              service:
                name: epicode-backend
                port:
                  number: 9111
          - path: /api/stats/public
            pathType: Exact
            backend:
              service:
                name: epicode-backend
                port:
                  number: 9111
          - path: /docs
            pathType: Exact
            backend:
              service:
                name: epicode-backend
                port:
                  number: 9111
          - path: /openapi.yaml
            pathType: Exact
            backend:
              service:
                name: epicode-backend
                port:
                  number: 9111
          - path: /health
            pathType: Exact
            backend:
              service:
                name: epicode-backend
                port:
                  number: 9111
          - path: /stats/public
            pathType: Exact
            backend:
              service:
                name: epicode-backend
                port:
                  number: 9111
          - path: /
            pathType: Prefix
            backend:
              service:
                name: epicode-frontend
                port:
                  number: 3000
