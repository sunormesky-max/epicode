[package]
name = "hyperspace-shadow"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/sunormesky-max/epicode"
description = "S1 shadow integration binary: mirrors production memory traffic into the true-4D Space4 engine and emits structural comparison reports (epicode issue #369)"

# S1 zero-hot-path rule: this crate is a SIBLING of backend/ and guard/ and is
# deliberately NOT a workspace member of the main repository. It must never
# appear in the root workspace, the root Cargo.lock, or any CI hot path.
# rusqlite reads production SQLite; the crypto set mirrors backend versions
# to decrypt the per-user AES-GCM `labels` column in place (read-only).
[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.23"

[[bin]]
name = "epicode-hyperspace"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
