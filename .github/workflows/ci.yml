name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'README*'
      - 'CHANGELOG*'
      - 'ROADMAP*'
      - 'CODE_OF_CONDUCT*'
      - 'SECURITY*'
      - 'AUTHORS*'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/FUNDING.yml'
      - '.github/labels.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'README*'
      - 'CHANGELOG*'
      - 'ROADMAP*'
      - 'CODE_OF_CONDUCT*'
      - 'SECURITY*'
      - 'AUTHORS*'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/FUNDING.yml'
      - '.github/labels.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify version consistency
        run: bash scripts/verify-version.sh

  backend:
    runs-on: ubuntu-latest
    needs: version-check
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "stable"
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config libssl-dev
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check build
        run: cargo check --locked
      - name: Run tests
        run: cargo test --locked --all-targets -- --test-threads=1
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Test dependency audit policy
        working-directory: .
        run: node --test scripts/check-dependency-audit.test.mjs
      - name: Audit backend and Guard dependency locks
        shell: bash
        run: |
          set +e
          cargo audit --json --file Cargo.lock > "$RUNNER_TEMP/backend-cargo-audit.json"
          backend_status=$?
          set -e
          node ../scripts/check-dependency-audit.mjs cargo "$RUNNER_TEMP/backend-cargo-audit.json" backend/Cargo.lock "$backend_status"

          set +e
          cargo audit --json --file ../guard/Cargo.lock > "$RUNNER_TEMP/guard-cargo-audit.json"
          guard_status=$?
          set -e
          node ../scripts/check-dependency-audit.mjs cargo "$RUNNER_TEMP/guard-cargo-audit.json" guard/Cargo.lock "$guard_status"

  frontend:
    runs-on: ubuntu-latest
    needs: version-check
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # 类型债(187)与lint债(52)已于 2026-09-26 全面迭代清零 — 门禁恢复严格
      - name: Type check
        run: npm run check
      - name: Audit frontend dependencies
        working-directory: .
        shell: bash
        run: |
          set +e
          npm --prefix frontend audit --json --registry=https://registry.npmjs.org > "$RUNNER_TEMP/frontend-npm-audit.json"
          audit_status=$?
          set -e
          node scripts/check-dependency-audit.mjs npm "$RUNNER_TEMP/frontend-npm-audit.json" frontend/package-lock.json "$audit_status" --lockfile frontend/package-lock.json

      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: "Build (hard gate, must reproduce production fingerprint)"
        run: npm run build

  guard:
    runs-on: ubuntu-latest
    needs: version-check
    defaults:
      run:
        working-directory: guard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "stable"
          components: rustfmt, clippy
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config libssl-dev
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            guard/target
          key: ${{ runner.os }}-guard-cargo-${{ hashFiles('guard/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check installer syntax
        run: bash -n install.sh
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check build
        run: cargo check --locked
      - name: Run tests
        run: cargo test --locked --all-targets

  sdk-typescript:
    runs-on: ubuntu-latest
    needs: version-check
    defaults:
      run:
        working-directory: backend/sdk/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/sdk/typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit TypeScript SDK dependencies
        working-directory: .
        shell: bash
        run: |
          set +e
          npm --prefix backend/sdk/typescript audit --json --registry=https://registry.npmjs.org > "$RUNNER_TEMP/sdk-typescript-npm-audit.json"
          audit_status=$?
          set -e
          node scripts/check-dependency-audit.mjs npm "$RUNNER_TEMP/sdk-typescript-npm-audit.json" backend/sdk/typescript/package-lock.json "$audit_status" --lockfile backend/sdk/typescript/package-lock.json
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  sdk-python:
    runs-on: ubuntu-latest
    needs: version-check
    defaults:
      run:
        working-directory: backend/sdk/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e .
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Audit Python SDK runtime dependencies
        run: pip-audit --strict --progress-spinner=off .
      - name: Type check
        run: pip install mypy && mypy epicode --ignore-missing-imports
      - name: Syntax check
        run: python -m py_compile epicode/*.py

  mcp-bridge:
    runs-on: ubuntu-latest
    needs: version-check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install bridge + test deps
        # The MCP bridge and its unit tests must be exercised in CI. The bridge
        # had previously been gitignored (now tracked), so `tests/test_epicode_mcp_server.py`
        # was a once-unrunable file. We install `pytest` + `pytest-asyncio` and run it.
        run: |
          pip install --upgrade pip
          pip install -r mcp-bridge/requirements.txt
          pip install pytest pytest-asyncio
      - name: Run bridge tests
        working-directory: tests
        env:
          PYTHONPATH: "${{ github.workspace }}/mcp-bridge"
        run: pytest -v
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Audit MCP bridge dependencies
        run: pip-audit --strict --progress-spinner=off --requirement mcp-bridge/requirements.txt --index-url https://pypi.org/simple
