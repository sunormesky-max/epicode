name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'guard/**'
      - 'deploy/**'
      - '**/Dockerfile*'
      - '.github/workflows/docker.yml'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify-backend-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build backend image (no credentials or push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./backend
          file: ./backend/Dockerfile.cloud
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-backend:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short

      - name: Build and push backend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./backend
          file: ./backend/Dockerfile.cloud
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-frontend-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build frontend image (no credentials or push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-frontend:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short

      - name: Build and push frontend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 镜像启动冒烟 (审计 2026-09 高优 #5 的收尾): 构建即验证 —
  # 用 EPICODE_* 新前缀起容器, /health 与 /api/v1/health 必须双双 200,
  # 同时覆盖 env 别名与 /api 前缀剥离两条修复路径
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Validate Compose loopback default
        env:
          EPICODE_ADMIN_KEY: smoke-key
          DEEPSEEK_API_KEY: smoke-key
        run: |
          set -euo pipefail
          docker compose -f deploy/docker-compose.yml config --format json > "$RUNNER_TEMP/compose.json"
          python - "$RUNNER_TEMP/compose.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as config_file:
              compose = json.load(config_file)
          ports = compose["services"]["gateway"]["ports"]
          assert any(
              port.get("host_ip") == "127.0.0.1"
              and str(port.get("published")) == "8080"
              and port.get("target") == 80
              for port in ports
          ), f"gateway must bind 127.0.0.1:8080 by default: {ports}"
          PY

      - name: Build backend image (no push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./backend
          file: ./backend/Dockerfile.cloud
          push: false
          load: true
          tags: epicode-smoke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (no push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: epicode-frontend-smoke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot gateway and probe frontend/API routing
        run: |
          set -euo pipefail
          docker network create epicode-smoke
          cleanup() {
            docker rm -f epicode-gateway epicode-frontend epicode-backend >/dev/null 2>&1 || true
            docker network rm epicode-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name epicode-backend --network epicode-smoke \
            -e EPICODE_ADMIN_KEY=smoke-key \
            -e EPICODE_LISTEN_ADDR=0.0.0.0:9111 \
            -e RUST_LOG=info \
            epicode-smoke:ci
          docker run -d --name epicode-frontend --network epicode-smoke epicode-frontend-smoke:ci
          docker run -d --name epicode-gateway --network epicode-smoke \
            -p 127.0.0.1:8080:80 \
            -v "$GITHUB_WORKSPACE/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          root_code=$(curl -s -o "$RUNNER_TEMP/frontend-root.html" -w "%{http_code}" http://127.0.0.1:8080/)
          spa_code=$(curl -s -o "$RUNNER_TEMP/frontend-route.html" -w "%{http_code}" http://127.0.0.1:8080/dashboard/memories)
          health_code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/health)
          api_code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/v1/health)
          stats_code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/stats/public)
          echo "root=${root_code} spa=${spa_code} health=${health_code} api=${api_code} stats=${stats_code}"
          test "${root_code}" = "200"
          test "${spa_code}" = "200"
          test "${health_code}" = "200"
          test "${api_code}" = "200"
          test "${stats_code}" = "200"
          grep -q 'id="root"' "$RUNNER_TEMP/frontend-root.html"
          grep -q 'id="root"' "$RUNNER_TEMP/frontend-route.html"
          test "$(docker inspect --format '{{.Config.User}}' epicode-frontend)" = "1000:1000"
          docker logs epicode-gateway | tail -30
