name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'guard/**'
      - 'deploy/**'
      - '**/Dockerfile*'
      - '.github/workflows/docker.yml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short

      - name: Build and push backend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./backend
          file: ./backend/Dockerfile.cloud
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short

      - name: Build and push frontend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 镜像启动冒烟 (审计 2026-09 高优 #5 的收尾): 构建即验证 —
  # 用 EPICODE_* 新前缀起容器, /health 与 /api/v1/health 必须双双 200,
  # 同时覆盖 env 别名与 /api 前缀剥离两条修复路径
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build backend image (no push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./backend
          file: ./backend/Dockerfile.cloud
          push: false
          load: true
          tags: epicode-smoke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot and probe
        run: |
          set -euo pipefail
          docker run -d --name smoke \
            -e EPICODE_ADMIN_KEY=smoke-key \
            -e EPICODE_LISTEN_ADDR=0.0.0.0:9111 \
            -e RUST_LOG=info \
            -p 127.0.0.1:9111:9111 \
            epicode-smoke:ci
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9111/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "== probe all (collect then assert) =="
          c1=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9111/health)
          c2=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9111/api/health)
          c3=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9111/api/stats/public)
          c4=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9111/api/v1/health)
          echo "health=${c1} api/health=${c2} api/stats/public=${c3} api/v1/health=${c4} (expect 200/200/200/非404)"
          echo "-- body of /api/health --"
          curl -s http://127.0.0.1:9111/api/health | head -c 300; echo
          docker logs smoke | tail -30
          test "${c1}" = "200" && test "${c2}" = "200" && test "${c3}" = "200" && test "${c4}" != "404"
          docker logs smoke | tail -20
