name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: '补发资产的既有tag(如 v1.0.3), 留空则仅跑release-please'
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  build-binaries:
    needs: release-please
    permissions:
      contents: write
    if: ${{ needs.release-please.outputs.release_created == 'true' || inputs.tag != '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_suffix: ''
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_suffix: ''
            archive_ext: tar.gz
          # macos/windows 暂移出矩阵: epicode-cloud 依赖 std::os::unix(TcpListener
          # from_raw_fd) 无法在 Windows 编译; ort-sys 构建脚本在 macOS 失败。
          # 跨平台移植立项后再加回。

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.88"
          targets: ${{ matrix.target }}

      - name: Install cross-compilation dependencies (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config libssl-dev

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build backend binaries
        run: |
          cd backend
          cargo build --release --target ${{ matrix.target }}

      - name: Build guard binary
        run: |
          cd guard
          cargo build --release --target ${{ matrix.target }}

      - name: Package binaries (fail-closed)
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RP_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          # tag 值经环境变量进入(审计三轮高优): 表达式内插进 bash 可被
          # dispatch 自由输入注入元字符; 此处再做严格格式校验
          VERSION="${RP_TAG}"
          if [ -n "${INPUT_TAG}" ]; then
            if ! echo "${INPUT_TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::invalid tag format: ${INPUT_TAG}" >&2
              exit 1
            fi
            VERSION="${INPUT_TAG}"
          fi
          TARGET=${{ matrix.target }}
          SUFFIX=${{ matrix.binary_suffix }}
          EXT=${{ matrix.archive_ext }}
          PKG_NAME="epicode-${VERSION}-${TARGET}"
          mkdir -p "${PKG_NAME}"

          # Fail-closed: 缺失/空二进制必须中止打包,
          # 不再发布带有效校验和的损坏归档 (审计 2026-09 高优 #9)
          copy_required() {
            if [[ ! -s "$1" ]]; then
              echo "::error::required artifact missing or empty: $1" >&2
              exit 1
            fi
            cp "$1" "$2/"
          }

          # Backend binaries
          copy_required "backend/target/${TARGET}/release/epicode${SUFFIX}" "${PKG_NAME}"
          copy_required "backend/target/${TARGET}/release/epicode-mcp${SUFFIX}" "${PKG_NAME}"
          copy_required "backend/target/${TARGET}/release/epicode-bench${SUFFIX}" "${PKG_NAME}"
          copy_required "backend/target/${TARGET}/release/epicode-migrate${SUFFIX}" "${PKG_NAME}"
          copy_required "backend/target/${TARGET}/release/epicode-cloud${SUFFIX}" "${PKG_NAME}"

          # Guard binary
          copy_required "guard/target/${TARGET}/release/epicode-guard${SUFFIX}" "${PKG_NAME}"

          # README and LICENSE
          copy_required "README.md" "${PKG_NAME}"
          copy_required "LICENSE" "${PKG_NAME}"
          
          # Create archive
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "${PKG_NAME}.zip" "${PKG_NAME}"
            echo "ASSET=${PKG_NAME}.zip" >> $GITHUB_ENV
          else
            tar czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
            echo "ASSET=${PKG_NAME}.tar.gz" >> $GITHUB_ENV
          fi
          
          # Generate SHA256 checksum
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            certutil -hashfile "${PKG_NAME}.zip" SHA256 | sed -n 2p | tr -d ' ' > "${PKG_NAME}.zip.sha256"
            echo "CHECKSUM_ASSET=${PKG_NAME}.zip.sha256" >> $GITHUB_ENV
          else
            shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
            echo "CHECKSUM_ASSET=${PKG_NAME}.tar.gz.sha256" >> $GITHUB_ENV
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ inputs.tag || needs.release-please.outputs.tag_name }} # action 参数为表达式绑定, 非shell内插
          files: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM_ASSET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
