name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: '补发资产的既有tag(如 v1.0.3), 留空则仅跑release-please'
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-input:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate backfill tag format
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must use the vMAJOR.MINOR.PATCH format" >&2
            exit 1
          fi

  release-please:
    needs: validate-input
    if: ${{ github.event_name == 'push' || inputs.tag == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  build-binaries:
    needs: [validate-input, release-please]
    permissions:
      contents: read
    if: ${{ always() && needs.validate-input.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.tag != '') || (needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_suffix: ''
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_suffix: ''
            archive_ext: tar.gz
          # macos/windows 暂移出矩阵: epicode-cloud 依赖 std::os::unix(TcpListener
          # from_raw_fd) 无法在 Windows 编译; ort-sys 构建脚本在 macOS 失败。
          # 跨平台移植立项后再加回。

    steps:
      - name: Validate selected release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must use the vMAJOR.MINOR.PATCH format" >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag commit and source version
        env:
          RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          checkout_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$checkout_commit" ]]; then
            echo "::error::checkout does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi
          expected_version="${RELEASE_TAG#v}"
          source_version="$(tr -d '[:space:]' < version.txt)"
          if [[ "$source_version" != "$expected_version" ]]; then
            echo "::error::source version $source_version does not match $RELEASE_TAG" >&2
            exit 1
          fi
          bash scripts/verify-version.sh

      - name: Require an existing release for manual backfills
        if: ${{ inputs.tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing_release_tag="$(gh release view "$RELEASE_TAG" --json tagName --jq .tagName)"
          if [[ "$existing_release_tag" != "$RELEASE_TAG" ]]; then
            echo "::error::backfill tag is not an existing release" >&2
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.88"
          targets: ${{ matrix.target }}

      - name: Install cross-compilation dependencies (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config libssl-dev

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build backend binaries
        run: |
          cd backend
          cargo build --release --target ${{ matrix.target }}

      - name: Build guard binary
        run: |
          cd guard
          cargo build --release --target ${{ matrix.target }}

      - name: Package binaries (fail-closed)
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG}"
          TARGET=${{ matrix.target }}
          SUFFIX=${{ matrix.binary_suffix }}
          EXT=${{ matrix.archive_ext }}
          PKG_NAME="epicode-${VERSION}-${TARGET}"
          mkdir -p "${PKG_NAME}"

          # Fail-closed: 缺失/空二进制必须中止打包,
          # 不再发布带有效校验和的损坏归档 (审计 2026-09 高优 #9)
          copy_required() {
            if [[ ! -s "$1" ]]; then
              echo "::error::required artifact missing or empty: $1" >&2
              exit 1
            fi
            cp "$1" "$2/"
          }

          # Backend binaries
          copy_required "backend/target/${TARGET}/release/epicode${SUFFIX}" "${PKG_NAME}"
          copy_required "backend/target/${TARGET}/release/epicode-mcp${SUFFIX}" "${PKG_NAME}"
          copy_required "backend/target/${TARGET}/release/epicode-bench${SUFFIX}" "${PKG_NAME}"
          copy_required "backend/target/${TARGET}/release/epicode-migrate${SUFFIX}" "${PKG_NAME}"
          copy_required "backend/target/${TARGET}/release/epicode-cloud${SUFFIX}" "${PKG_NAME}"

          # Guard binary
          copy_required "guard/target/${TARGET}/release/epicode-guard${SUFFIX}" "${PKG_NAME}"

          # README and LICENSE
          copy_required "README.md" "${PKG_NAME}"
          copy_required "LICENSE" "${PKG_NAME}"
          
          # Create archive
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "${PKG_NAME}.zip" "${PKG_NAME}"
            echo "ASSET=${PKG_NAME}.zip" >> $GITHUB_ENV
          else
            tar czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
            echo "ASSET=${PKG_NAME}.tar.gz" >> $GITHUB_ENV
          fi
          
          # Generate SHA256 checksum
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            certutil -hashfile "${PKG_NAME}.zip" SHA256 | sed -n 2p | tr -d ' ' > "${PKG_NAME}.zip.sha256"
            echo "CHECKSUM_ASSET=${PKG_NAME}.zip.sha256" >> $GITHUB_ENV
          else
            shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
            echo "CHECKSUM_ASSET=${PKG_NAME}.tar.gz.sha256" >> $GITHUB_ENV
          fi

      - name: Upload packaged assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            epicode-*.tar.gz
            epicode-*.zip
            epicode-*.sha256
          if-no-files-found: error
          retention-days: 1

  upload-release-assets:
    needs: [validate-input, release-please, build-binaries]
    if: ${{ always() && needs.build-binaries.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: dist

      - name: Upload assets to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
